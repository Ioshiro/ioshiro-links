name: add link

# le reaction non attivano workflow: si controlla periodicamente
# (o a mano con "Run workflow") se il proprietario ha messo 👍 alle issue "link"
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: add-link
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: add approved links
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # solo issue aperte col form "+ link" e approvate dal proprietario con 👍
          for N in $(gh issue list --repo "$GITHUB_REPOSITORY" --label link --state open --json number --jq '.[].number'); do
            approved=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/reactions" --paginate \
              --jq "[.[] | select(.content == \"+1\" and .user.login == \"$OWNER\")] | length")
            [ "${approved:-0}" -gt 0 ] || continue

            export ISSUE_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq .title)
            export ISSUE_BODY=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq '.body // ""')
            export ISSUE_DATE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" --jq .created_at)

            if ! node .github/scripts/add-link.mjs _data/links.yml; then
              echo "::warning::issue #$N non valida, saltata"
              continue
            fi
            git add _data/links.yml
            git diff --cached --quiet || git commit -m "link: #$N"
            git push
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "salvato in ~/ioshiro ☂"
          done
